# Streamlit settings for both local runs and Streamlit Community Cloud.
#
# Port and bind address are deliberately NOT set here: the host supplies
# its own, and a value in this file could fight with it.

[server]
headless = true
# Must match config.MAX_UPLOAD_MB (default 20).
maxUploadSize = 20
# Streamlit's file watcher would otherwise walk torch/transformers on
# every start; the app is not edited while it serves visitors.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme.light]
primaryColor = "#4F46E5"

[theme.dark]
primaryColor = "#818CF8"
