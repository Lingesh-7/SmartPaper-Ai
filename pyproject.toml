[project]
name = "smartpaper-ai"
version = "1.0.0"
description = "Multi-agent, multimodal research-paper Q&A assistant (Streamlit)."
readme = "README.md"
requires-python = ">=3.13"
# Only what the running app imports. Streamlit Community Cloud installs
# from uv.lock; requirements.txt is generated from this list for
# pip-based hosts - see the header of that file.
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.7",
    "langchain-core>=1.4.1",
    "langchain-google-genai>=4.2.5",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openrouter>=0.2.3",
    "langgraph>=1.2.4",
    "pillow>=12.2.0",
    "pypdf>=6.13.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.58.0",
    # Named here only so the CPU-only index below applies to them (uv
    # sources work on direct dependencies). They are pulled in anyway by
    # sentence-transformers and unstructured.
    "torch>=2.10,<2.11",
    "torchvision>=0.25,<0.26",
    "unstructured[pdf]>=0.23.0",
]

[project.optional-dependencies]
# The QLoRA fine-tuned Phi-3 reader (models/finetuned_reader.py). It is
# not wired into the app and needs a CUDA GPU, so it is not installed
# by default:  uv sync --extra finetune
finetune = [
    "unsloth>=2026.6.7",
]

# CPU-only PyTorch everywhere. Hosts like Streamlit Community Cloud
# install from uv.lock; without this, Linux gets the CUDA build -
# several GB of GPU libraries the app never uses and the host cannot fit.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_pipeline.py at the repo root is a manual script that calls the
# real providers; it is not part of the offline suite.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestRemovedIn10Warning",
]
